<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Slaughter Games">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <title>Login – Slaughter Games</title>
</head>
<body>
  <main class="app-main" style="padding-top:8vh">
    <div class="center">
      <img src="/assets/logo-640.webp" alt="Slaughter Games" style="width:140px;margin:0 auto">
      <h1 class="page-title" style="margin-top:10px">Einloggen</h1>
    </div>
    <form class="card mt" id="loginForm" autocomplete="on">
      <div class="field">
        <label for="loginName">Dein Rufname</label>
        <input id="loginName" name="username" autocomplete="username" autocapitalize="words" placeholder="z. B. Burni" required>
      </div>
      <div class="field">
        <label for="loginPw">Passwort</label>
        <input id="loginPw" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn block" type="submit">Einloggen</button>
      <p class="msg err mt" id="loginMsg" role="alert"></p>
    </form>
    <p class="center small faint mt">Accounts legt der Admin an. Passwort weißt du – sonst frag Mugi.</p>
  </main>
  <script type="module" src="/js/page-login.js"></script>
</body>
</html>
