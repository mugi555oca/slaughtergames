<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Slaughter Games">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <title>Turnier – Slaughter Games</title>
</head>
<body>
  <main class="app-main">
    <div id="tHead"><div class="skel" style="height:90px"></div></div>
    <div id="mine"></div>
    <div class="seg mt" role="tablist">
      <button class="on" data-view="round">Runde</button>
      <button data-view="table">Tabelle</button>
      <button data-view="history">Verlauf</button>
    </div>
    <section id="vRound" class="mt"></section>
    <section id="vTable" class="mt" hidden></section>
    <section id="vHistory" class="mt" hidden></section>
    <div id="actions" class="mt-l"></div>
    <div id="admin" class="mt"></div>
  </main>
  <script type="module" src="/tournament-app/js/t-round.js"></script>
</body>
</html>
