<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Slaughter Games">
  <meta name="description" content="Slaughter Games – das jährliche Magic-Draft-Turnier. Rankings, Sieger, Turniere, Merch.">
  <meta property="og:title" content="Slaughter Games">
  <meta property="og:image" content="https://slaughtergames.at/icons/icon-512.png">
  <title>Slaughter Games</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="app-main">
    <section class="center" style="padding:6px 0 2px">
      <img src="/assets/logo-640.webp" alt="Slaughter Games" width="150" height="160" style="width:150px;height:auto;margin:0 auto;filter:drop-shadow(0 0 28px rgba(214,42,42,.35))">
      <h1 class="sr-only">Slaughter Games</h1>
      <p class="muted small" style="margin-top:6px">Independent Magic Draft Tournament · seit 2021</p>
    </section>

    <div id="installSlot" class="mt"></div>

    <section class="section" id="liveSlot" hidden></section>

    <section class="section">
      <a class="card hero" href="/turnier.html?sg=7" id="nextCard" style="display:block">
        <div class="row between">
          <span class="chip gold">Nächstes Event</span>
          <span class="small muted" id="nextDate"></span>
        </div>
        <h3 class="display" style="font-size:28px;margin:10px 0 0;color:var(--text)" id="nextTitle"></h3>
        <div class="countdown" id="countdown"></div>
      </a>
    </section>

    <section class="section">
      <div class="section-head"><h2>Grand Slaughterer</h2></div>
      <a class="card row" id="gsCard" href="#" style="gap:16px">
        <img class="avatar lg" id="gsImg" style="border:3px solid var(--gold);box-shadow:0 0 22px rgba(242,185,75,.3)" src="" alt="">
        <div class="grow">
          <div class="tiny gold" style="font-weight:700;letter-spacing:.12em;text-transform:uppercase" id="gsYear"></div>
          <div class="display" style="font-size:24px;line-height:1.1;margin:4px 0" id="gsName"></div>
          <div class="small muted" id="gsSub"></div>
        </div>
        <img src="/axt.jpg" alt="Die Axt" style="width:58px;height:58px;object-fit:cover;border-radius:12px">
      </a>
    </section>

    <section class="section">
      <nav class="quick" aria-label="Schnellzugriff">
        <a href="/galerie.html" id="qGallery"></a>
        <a href="/spieler.html" id="qPlayers"></a>
        <a href="/merch.html" id="qMerch"></a>
        <a href="/blog.html" id="qBlog"></a>
      </nav>
    </section>

    <section class="section">
      <div class="section-head"><h2>Eternal Ranking</h2><a href="/ranking.html">Alle</a></div>
      <div class="rank-list" id="topRank"><div class="skel" style="height:290px"></div></div>
    </section>

    <section class="section">
      <div class="section-head"><h2>Aus den Axe-Files</h2><a href="/blog.html">Blog</a></div>
      <div id="latestPost"></div>
    </section>

    <section class="section">
      <div class="section-head"><h2>Unsere Cubes</h2></div>
      <div class="row wrap" id="cubes" style="gap:8px"></div>
    </section>

    <p class="center faint tiny mt-l">&copy; 2026 Slaughter Games</p>
  </main>

  <script type="module" src="/js/page-home.js"></script>
</body>
</html>
