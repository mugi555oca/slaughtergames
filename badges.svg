<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    Abzeichen-Icons. Alle 24x24, reine Konturen in currentColor, damit sie
    sich ueber die Textfarbe einfaerben lassen. Symbol-ID = badges.icon_key.
  -->
  <defs>
    <style>
      symbol { fill: none; stroke: currentColor; stroke-width: 1.8;
               stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Founding Father -->
  <symbol id="badge-crown" viewBox="0 0 24 24">
    <path d="M4 18h16"/>
    <path d="M4 18l-1.2-9L8 12.4 12 5.5l4 6.9 5.2-3.4L20 18"/>
  </symbol>

  <!-- Show Master -->
  <symbol id="badge-mic" viewBox="0 0 24 24">
    <rect x="9" y="2.5" width="6" height="10.5" rx="3"/>
    <path d="M5.5 11a6.5 6.5 0 0 0 13 0"/>
    <path d="M12 17.5V21"/><path d="M8.5 21h7"/>
  </symbol>

  <!-- Tragischer Dichter -->
  <symbol id="badge-quill" viewBox="0 0 24 24">
    <path d="M20.5 3.5c-8 .8-12.6 5.6-15 14"/>
    <path d="M20.5 3.5c1.2 7-2.4 12.4-8.6 13.6l-3.4.6 1-3.2"/>
    <path d="M3 21l3.5-3.5"/>
  </symbol>

  <!-- Küchenchef -->
  <symbol id="badge-chefhat" viewBox="0 0 24 24">
    <path d="M7.5 20.5h9v-3.5h-9z"/>
    <path d="M7.5 17a4.2 4.2 0 0 1-1.2-8A3.8 3.8 0 0 1 12 5.8a3.8 3.8 0 0 1 5.7 3.2 4.2 4.2 0 0 1-1.2 8"/>
  </symbol>

  <!-- Grill Master -->
  <symbol id="badge-flame" viewBox="0 0 24 24">
    <path d="M12 21.5a5.5 5.5 0 0 0 5.5-5.5c0-4.5-5.5-8.5-5.5-13.5 0 0-1.2 4.5-3.5 6.8S6.5 12.8 6.5 16A5.5 5.5 0 0 0 12 21.5z"/>
    <path d="M12 21.5a2.4 2.4 0 0 0 2.4-2.4c0-2-2.4-3.4-2.4-5.6 0 2.2-2.4 3.6-2.4 5.6A2.4 2.4 0 0 0 12 21.5z"/>
  </symbol>

  <!-- Bar Keeper -->
  <symbol id="badge-cocktail" viewBox="0 0 24 24">
    <path d="M4 5h16l-8 8.5z"/>
    <path d="M12 13.5V20"/><path d="M8 20h8"/>
    <path d="M15.5 8.5l3.5-4"/>
  </symbol>

  <!-- Pub Quizmaster -->
  <symbol id="badge-quiz" viewBox="0 0 24 24">
    <path d="M4 4.5h16v11H9.5L5 20v-4.5H4z"/>
    <path d="M9.8 8.4a2.3 2.3 0 1 1 2.9 2.2c-.6.2-.9.6-.9 1.3"/>
    <path d="M11.8 13.9h.01"/>
  </symbol>

  <!-- Master of Excel -->
  <symbol id="badge-table" viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="16" rx="2"/>
    <path d="M3 9h18"/><path d="M9 9v11"/><path d="M3 14.5h18"/>
  </symbol>

  <!-- Übernachtiger -->
  <symbol id="badge-moon" viewBox="0 0 24 24">
    <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>
    <path d="M16.5 3.5h3.5l-3.5 3.5h3.5"/>
  </symbol>

  <!-- Übelster Loss: Schwert mit abgebrochener Klinge -->
  <symbol id="badge-brokensword" viewBox="0 0 24 24">
    <path d="M8 16.6h8"/>
    <path d="M12 16.6V21"/>
    <path d="M10.2 16.6v-3.9l1.8 1.5 1.8-1.5v3.9"/>
    <path d="M14.1 10.9l1.1-7.4 2.6 1.9-1.9 6.4z"/>
  </symbol>

  <!-- Slow Player -->
  <symbol id="badge-hourglass" viewBox="0 0 24 24">
    <path d="M6.5 3h11"/><path d="M6.5 21h11"/>
    <path d="M7.5 3c0 4.5 4.5 5.5 4.5 9 0-3.5 4.5-4.5 4.5-9"/>
    <path d="M7.5 21c0-4.5 4.5-5.5 4.5-9 0 3.5 4.5 4.5 4.5 9"/>
  </symbol>

  <!-- Die Socken -->
  <symbol id="badge-sock" viewBox="0 0 24 24">
    <path d="M9 2.8h6v9.4l3.1 3.1a3.7 3.7 0 0 1-5.2 5.2l-4.7-4.7a3.2 3.2 0 0 1 0-4.5L9 9.6z"/>
    <path d="M9 6.2h6"/>
  </symbol>
</svg>
