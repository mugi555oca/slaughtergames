<body>
  <main class="app-main">
    <h1 class="page-title" id="edTitle">Neuer Artikel</h1>
    <form id="edForm" class="stack">
      <button type="button" class="cover-pick" id="coverBtn"><span id="coverHint">＋ Titelbild wählen</span><img id="coverImg" alt="" hidden></button>
      <input type="file" id="coverFile" accept="image/*" hidden>
      <div class="field"><label for="pTitle">Titel</label><input id="pTitle" maxlength="160" required placeholder="Was ist passiert?"></div>
      <div class="field">
        <label for="pBody">Text</label>
        <div class="md-bar" id="mdBar">
          <button type="button" data-md="b" title="Fett"><b>B</b></button>
          <button type="button" data-md="i" title="Kursiv"><i>I</i></button>
          <button type="button" data-md="h" title="Zwischenüberschrift">H</button>
          <button type="button" data-md="l" title="Liste">• Liste</button>
          <button type="button" data-md="a" title="Link">Link</button>
          <button type="button" data-md="img" title="Bild einfügen" class="img-btn">📷 Bild</button>
        </div>
        <textarea id="pBody" rows="14" maxlength="60000" placeholder="Erzähl die Geschichte. Leere Zeile = neuer Absatz.&#10;&#10;Bilder fügst du mit „📷 Bild“ an der Cursor-Stelle ein."></textarea>
        <input type="file" id="bodyFile" accept="image/*" hidden>
      </div>
      <div class="btn-row"><button type="button" class="btn ghost" id="previewBtn">Vorschau</button><button class="btn" type="submit" id="pubBtn">Veröffentlichen</button></div>
      <button type="button" class="btn danger" id="delBtn" hidden>Artikel löschen</button>
    </form>
  </main>
  <script type="module" src="/js/page-blogedit.js"></script>
</body>
</html>
