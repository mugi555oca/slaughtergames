<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slaughter Games – Spielerprofil</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="styles.css?v=2.3" />
  <style>
    .pp-wrap{max-width:900px;margin:0 auto;padding:16px}
    .pp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .pp-card{background:#171a21;border-radius:12px;padding:16px;color:#fff}
    .pp-name{font-size:30px;margin:0}.pp-real{opacity:.8;margin:4px 0 12px}
    .pp-grid{display:grid;grid-template-columns:140px 1fr;gap:18px}
    .pp-img{width:140px;height:140px;object-fit:cover;border-radius:50%;border:3px solid #c8302f;box-shadow:0 0 18px rgba(200,48,47,.45)}
    .pp-card h3{margin:18px 0 8px;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;color:#ffb14d}
    .chip{display:inline-flex;align-items:center;background:#2a313f;padding:6px 10px;border-radius:999px;margin:3px;font-size:13px}
    .chip-badge{gap:8px;cursor:help}
    .chip-badge b{background:#c8302f;border-radius:999px;padding:1px 7px;font-size:11px;letter-spacing:.04em}
    .chip-label{opacity:.85}
    .chip-fav{text-decoration:none;color:#fff;background:#3a2a1f;border:1px solid rgba(255,177,77,.5)}
    .chip-fav:hover{background:#4a3525;border-color:#ffb14d}
    /* Teilnahme-Logos deutlich groesser als vorher (war 26px) */
    .pp-part{height:56px;margin:0 8px 8px 0;cursor:help;transition:transform .15s ease}
    .pp-part:hover{transform:scale(1.12)}
    .pp-empty{opacity:.55;font-style:italic;font-size:14px}
    .pp-nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .pp-btn{display:inline-block;padding:8px 14px;border-radius:8px;background:#2b3240;color:#fff;
            text-decoration:none;font-size:14px;border:1px solid transparent;transition:background .15s ease}
    .pp-btn:hover{background:#3a4354}
    .pp-btn[hidden]{display:none}
    .pp-btn-accent{background:#c8302f}.pp-btn-accent:hover{background:#e03b3a}
    .badge-icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;
                stroke-linecap:round;stroke-linejoin:round;color:#ffb14d;flex:0 0 auto}
    .chip-count{font-size:11px;background:#c8302f;border-radius:999px;padding:1px 7px;margin-left:2px}
    @media (max-width:600px){
      .pp-grid{grid-template-columns:1fr;justify-items:center;text-align:center}
      .pp-part{height:44px}
    }
  </style>
</head>
<body>
  <div class="pp-wrap">
    <div class="pp-head">
      <a href="index.html"><img src="main_logo.png" alt="Slaughter Games" style="height:44px"></a>
      <nav class="pp-nav">
        <a class="pp-btn" href="index.html">Startseite</a>
        <a class="pp-btn" href="tournament-app/dashboard.html">Tournament App</a>
        <a class="pp-btn pp-btn-accent" id="ppEdit" href="tournament-app/profile.html" hidden>Mein Profil bearbeiten</a>
      </nav>
    </div>

    <div class="pp-card">
      <div class="pp-grid">
        <img id="ppImg" class="pp-img" src="main_logo.png" alt="Profilbild" />
        <div>
          <h1 id="ppName" class="pp-name">Spieler</h1>
          <div id="ppReal" class="pp-real"></div>

          <h3>SG Teilnahmen</h3>
          <div id="ppParts"></div>

          <h3>Äxte</h3>
          <div id="ppAxes"></div>

          <h3>Abzeichen</h3>
          <div id="ppBadges"></div>

          <h3>Lieblingskarte</h3>
          <div id="ppFav"></div>

          <h3>Beschreibung</h3>
          <p id="ppDesc"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="./tournament-app/js/player-profile-page.js" type="module"></script>
</body>
</html>
