<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Slaughter Games">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <title>Spielerprofil – Slaughter Games</title>
</head>
<body>
  <main class="app-main">
    <div class="profile-head">
      <img class="avatar xl" id="ppImg" src="/icons/logo-160.webp" alt="">
      <h1 id="ppName">Spieler</h1>
      <div class="muted" id="ppReal"></div>
      <a class="btn sm ghost" id="ppEdit" href="/profil.html" hidden>Mein Profil bearbeiten</a>
    </div>
    <p class="center mt" id="ppDesc" style="font-style:italic;color:var(--muted)"></p>

    <div class="stat-row mt-l" id="ppStats"></div>

    <section class="section"><div class="section-head"><h2>Slaughter Games</h2></div><div class="rank-list" id="ppParts"></div></section>
    <section class="section" id="weekly"><div class="section-head"><h2>Weekly Performance</h2></div><div id="ppWeekly"><div class="skel" style="height:260px"></div></div></section>
    <section class="section"><div class="section-head"><h2>Äxte</h2></div><div class="card" id="ppAxes"></div></section>
    <section class="section"><div class="section-head"><h2>Abzeichen</h2></div><div id="ppBadges"></div></section>
    <section class="section"><div class="section-head"><h2>Lieblingskarte</h2></div><div id="ppFav"></div></section>
  </main>
  <script type="module" src="/js/page-player.js"></script>
</body>
</html>
